<text x="584.0" y="270.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#52514e" text-anchor="start">22.5% in reality, while its huge</text>
<text x="584.0" y="286.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#52514e" text-anchor="start">0–10% bin (n=1,682) wins 12.8%.</text>
<text x="584.0" y="310.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#52514e" text-anchor="start">Bins right of 30% hold few</text>
<text x="584.0" y="326.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#52514e" text-anchor="start">opportunities — whiskers, not</text>
<text x="584.0" y="342.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#52514e" text-anchor="start">points, are the signal there.</text>
