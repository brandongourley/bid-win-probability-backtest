<text x="584.0" y="166.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#52514e" text-anchor="start">91% of segment × size predictions</text>
<text x="584.0" y="182.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#52514e" text-anchor="start">land in the two left bins, which sit</text>
